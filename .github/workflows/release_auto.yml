# 发布【主包 jm-view-server】: push 到 master 且 commit message 以 v 开头即触发,
# 例如   git commit -m "v0.3.2: 发布 v0.3.2"   && git push
# GitHub Release 正文优先读取 CHANGELOG.md 中对应版本的章节。
# 薄壳包 plugin_jm_server 走单独的 release_shim.yml(手动触发), 不在此处发布。
name: Auto Release & Publish

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse Tag & Body
        id: tb
        run: |
          commit_message=$(git log --format=%B -n 1 ${{ github.sha }})
          python .github/release.py "$commit_message"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tb.outputs.tag }}
          body_path: release_body.txt

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Release PYPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
