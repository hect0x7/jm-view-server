<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta http-equiv="Pragma" content="no-cache" />

<title>上传文件 · jm-view-server</title>

<!-- PWA -->
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#5b5bd6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(function(){});});}</script>
<link rel="stylesheet" href="/static/css/app.css?t={{randomArg}}">
<style>
  /* 拖拽上传区 */
  .dropzone {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--sp-3);
    padding: var(--sp-8) var(--sp-5);
    border: 2px dashed var(--border-strong);
    border-radius: var(--r-xl);
    background: var(--bg-elevated);
    text-align: center; cursor: pointer;
    transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out), transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  }
  .dropzone > *:not(input) { pointer-events: none; }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--brand);
    background: var(--brand-soft);
    transform: scale(1.008);
    box-shadow: var(--shadow-md);
  }
  .dropzone:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-ring); }
  .dropzone.is-disabled { opacity: .55; pointer-events: none; }
  .dropzone.is-compact { padding: var(--sp-5) var(--sp-4); gap: var(--sp-2); }
  .dropzone.is-compact .dz-orb { width: 52px; height: 52px; }
  .dropzone.is-compact .dz-orb svg { width: 28px; height: 28px; }
  .dropzone.is-compact .dz-title { font-size: 15px; }
  .dropzone.is-compact .dz-hint { display: none; }
  .dropzone .dz-orb {
    width: 84px; height: 84px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--brand-soft); color: var(--brand);
    transition: transform var(--dur-base) var(--ease-spring);
  }
  .dropzone.dragover .dz-orb { transform: translateY(-3px) scale(1.06); }
  .dropzone .dz-orb svg { width: 44px; height: 44px; }
  .dropzone .dz-title { font-size: 17px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
  .dropzone .dz-sub { font-size: 14px; color: var(--text-secondary); }
  .dropzone .dz-sub span { color: var(--brand); font-weight: 500; }
  .dropzone .dz-hint { margin-top: var(--sp-1); font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

  /* 上传目标 */
  .upload-target {
    display: flex; align-items: center; gap: var(--sp-3);
    margin-bottom: var(--sp-4);
    padding: var(--sp-3) var(--sp-4);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    background: color-mix(in srgb, var(--brand) 6%, var(--bg-elevated));
  }
  .upload-target .target-ico {
    width: 38px; height: 38px; border-radius: var(--r-md);
    display: grid; place-items: center; flex-shrink: 0;
    background: var(--brand-soft); color: var(--brand);
  }
  .upload-target .target-ico svg { width: 20px; height: 20px; }
  .upload-target .target-body { min-width: 0; }
  .upload-target .target-label {
    margin-bottom: 3px;
    font-size: 12px; font-weight: 600; color: var(--text-secondary);
  }
  .upload-target .target-path {
    font-family: var(--font-mono); font-size: 13px; color: var(--text);
    overflow-wrap: anywhere;
  }

  /* 已选文件信息 + 队列 */
  .up-info-row {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-3) var(--sp-4);
    background: var(--bg-elevated);
    border-radius: var(--r-md);
    border: 1px solid var(--border);
    margin-top: var(--sp-4);
  }
  .up-info-row .up-ico {
    width: 40px; height: 40px; border-radius: var(--r-md);
    display: grid; place-items: center; flex-shrink: 0;
    background: var(--brand-soft); color: var(--brand);
  }
  .up-info-row .up-ico svg { width: 20px; height: 20px; }
  .up-info-row .up-body { flex: 1; min-width: 0; }
  #fileName { font-size: 14px; font-weight: 500; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #fileName.has-files { color: var(--text); }
  .meta-row { display: flex; gap: var(--sp-4); margin-top: var(--sp-1); flex-wrap: wrap; }
  #fileSize, #fileType { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

  .upload-queue {
    margin-top: var(--sp-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    background: var(--bg-elevated);
    max-height: 220px;
    overflow-y: auto;
  }
  .upload-queue[hidden] { display: none; }
  .upload-queue-item {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .upload-queue-item.is-entering {
    animation: riseIn var(--dur-fast) var(--ease-out) both;
  }
  .upload-queue-item:last-child { border-bottom: 0; }
  .upload-queue-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .upload-queue-size { font-size: 12px; font-family: var(--font-mono); color: var(--text-muted); flex-shrink: 0; }
  .upload-queue-remove {
    width: 30px; height: 30px; border-radius: var(--r-sm);
    display: grid; place-items: center; color: var(--text-muted); flex-shrink: 0;
    transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .upload-queue-remove:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .upload-queue-remove:disabled { opacity: .4; cursor: not-allowed; }
  .upload-queue-remove svg { width: 14px; height: 14px; }

  /* 进度条 */
  .progress-wrap { margin-top: var(--sp-4); }
  .progress-label { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-2); gap: var(--sp-2); }
  .progress-label span { font-size: 13px; color: var(--text-secondary); }
  #progress-value { font-family: var(--font-mono); font-size: 13px; color: var(--brand); font-weight: 600; }
  .progress-track {
    position: relative; height: 7px; border-radius: var(--r-pill);
    background: var(--bg-sunken); overflow: hidden;
  }
  #progressFill {
    width: 100%; height: 100%; border-radius: var(--r-pill);
    background: var(--brand);
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
  }
  .progress-track.is-saving #progressFill {
    animation: uploadSavingPulse 1.1s ease-in-out infinite;
  }
  .progress-track.is-error #progressFill { background: var(--danger); }
  .progress-track.is-success #progressFill { background: var(--success); }
  @keyframes uploadSavingPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .55; }
  }

  /* 操作按钮行 */
  .action-row {
    display: flex; gap: var(--sp-3); margin-top: var(--sp-5);
    flex-wrap: wrap;
  }
  .action-row .btn { flex: 1; min-width: 120px; justify-content: center; min-height: 44px; }
  .action-row [hidden] { display: none; }

  /* 上传结果（按语义区分成功与失败） */
  #result {
    margin-top: var(--sp-4);
    padding: var(--sp-3) var(--sp-4);
    background: color-mix(in srgb, var(--success) 10%, var(--bg-elevated));
    border: 1px solid color-mix(in srgb, var(--success) 32%, transparent);
    border-radius: var(--r-md);
    font-size: 14px; color: var(--text);
    line-height: 1.6;
    overflow-wrap: anywhere;
    white-space: pre-line;
    animation: riseIn var(--dur-base) var(--ease-out) both;
  }
  #result.is-error {
    background: color-mix(in srgb, var(--danger) 10%, var(--bg-elevated));
    border-color: color-mix(in srgb, var(--danger) 35%, transparent);
    color: var(--danger);
  }
  .result-actions {
    display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-3);
  }
  .result-actions[hidden] { display: none; }
  .result-actions .btn { min-height: 40px; }

  /* 文件信息展开区（保留兼容旧触发） */
  #info { margin-top: var(--sp-2); }
  @media (pointer: coarse), (max-width: 860px) {
    .upload-queue-remove { width: 40px; height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dropzone, .dropzone .dz-orb, .upload-queue-item, #progressFill, #result { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <span style="font-size:15px;font-weight:600;letter-spacing:-0.01em">上传文件</span>
      <div class="spacer"></div>
    </div>

    <div class="content">
      <div class="content-narrow">
        <div class="page-head rise">
          <h1>上传文件</h1>
          <p>把一个或多个图片、压缩包拖到下方区域，或点击选择文件（支持多次追加）</p>
        </div>

        <div class="upload-target rise" style="animation-delay:.02s">
          <span class="target-ico" id="targetIco"></span>
          <div class="target-body">
            <div class="target-label">上传到</div>
            <div class="target-path" id="uploadTarget">{{ uploadTarget }}</div>
          </div>
        </div>

        <!-- 拖拽区（支持键盘聚焦、回车/空格触发选文件） -->
        <div class="dropzone rise" id="dropzone" role="button" tabindex="0" aria-label="点击或拖拽选择要上传的文件" style="animation-delay:.04s">
          <span class="dz-orb" id="dzOrb"></span>
          <div class="dz-title">拖拽一个或多个文件到此处</div>
          <div class="dz-sub">或 <span>点击选择文件</span></div>
          <div class="dz-hint">支持多选与继续追加，可逐项移除</div>
          <input type="file" name="file" id="file" multiple style="display:none">
        </div>

        <!-- 已选文件摘要行 -->
        <div class="up-info-row rise" id="uploadSummaryRow" style="animation-delay:.06s">
          <span class="up-ico" id="fileIco"></span>
          <div class="up-body">
            <div id="fileName">尚未选择文件</div>
            <div class="meta-row">
              <span id="fileSize"></span>
              <span id="fileType"></span>
            </div>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" id="clearQueueBtn" hidden onclick="clearUploadQueue()">清空</button>
        </div>

        <!-- 自动展示的待上传文件队列 -->
        <div class="upload-queue" id="uploadQueue" hidden></div>

        <!-- 进度条 -->
        <div class="progress-wrap rise" style="animation-delay:.08s">
          <div class="progress-label">
            <span>上传进度</span>
            <span id="progress-value">0%</span>
          </div>
          <div class="progress-track" id="progressTrack">
            <div id="progressFill"></div>
            <div id="mask" hidden></div>
          </div>
        </div>

        <!-- 上传结果 -->
        <div id="result" role="status" aria-live="polite" style="display:none"></div>
        <div class="result-actions" id="resultActions" hidden>
          <a class="btn btn-outline btn-sm" id="openTargetDirBtn" href="/?path={{ uploadTarget|urlencode }}">打开目标目录</a>
          <button type="button" class="btn btn-outline btn-sm" id="retryUploadBtn" hidden onclick="uploadFile()">重试上传</button>
          <button type="button" class="btn btn-ghost btn-sm" id="continueUploadBtn" hidden onclick="clearUploadQueue()">继续上传</button>
        </div>

        <div id="info"></div>

        <!-- 操作按钮 -->
        <div class="action-row rise" style="animation-delay:.1s">
          <button type="button" class="btn btn-primary" id="submit" onclick="uploadFile()" disabled>
            <span id="uploadIco"></span> <span id="submitLabel">选择文件后上传</span>
          </button>
          <button type="button" class="btn btn-outline" id="cancelUploadBtn" hidden onclick="cancelCurrentUpload()">取消上传</button>
          <a class="btn btn-ghost" id="uploadBackBtn" href="/?path={{ uploadTarget|urlencode }}"
             style="font-weight:600;color:var(--text)">返回</a>
        </div>

      </div>
    </div>
  </div>
  <nav class="mobile-bar"></nav>
</div>

<script src="/static/js/app.js?t={{randomArg}}"></script>
<script src="/static/js/app-shell.js?t={{randomArg}}"></script>
<script src="/static/js/upload.js?t={{randomArg}}"></script>
<script>
  renderShell('upload');

  document.getElementById('dzOrb').innerHTML = icon('upload');
  document.getElementById('targetIco').innerHTML = icon('folder');
  document.getElementById('fileIco').innerHTML = icon('images');
  document.getElementById('uploadIco').innerHTML = icon('upload');

  var backBtn = document.getElementById('uploadBackBtn');
  if (backBtn) {
    backBtn.addEventListener('click', function(e) {
      if (document.referrer && document.referrer.indexOf(window.location.origin) === 0 && window.history.length > 1) {
        e.preventDefault();
        window.history.back();
      }
    });
  }

  // 阻止拖偏到框外时浏览器直接打开本地文件
  ['dragover', 'drop'].forEach(function(ev) {
    window.addEventListener(ev, function(e) { e.preventDefault(); });
  });

  var dz = document.getElementById('dropzone');
  var fileInput = document.getElementById('file');
  var dragDepth = 0;

  dz.addEventListener('click', function(e) {
    if (dz.classList.contains('is-disabled')) return;
    if (e.target !== fileInput) fileInput.click();
  });
  dz.addEventListener('keydown', function(e) {
    if (dz.classList.contains('is-disabled')) return;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      fileInput.click();
    }
  });

  dz.addEventListener('dragenter', function(e) {
    e.preventDefault();
    if (dz.classList.contains('is-disabled')) return;
    dragDepth++;
    dz.classList.add('dragover');
  });
  dz.addEventListener('dragover', function(e) {
    e.preventDefault();
  });
  dz.addEventListener('dragleave', function(e) {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) dz.classList.remove('dragover');
  });
  dz.addEventListener('drop', function(e) {
    e.preventDefault();
    dragDepth = 0;
    dz.classList.remove('dragover');
    if (dz.classList.contains('is-disabled')) return;
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      addFilesToUploadQueue(e.dataTransfer.files);
    }
  });
</script>
</body>
</html>
